<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smysl budoucnosti</title>
<style>
body{margin:0;background:#050816;color:#e9f0ff;font-family:system-ui,sans-serif;overflow:hidden}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box}
h1{font-size:38px;margin:0 0 10px}
.sub{opacity:.8;max-width:700px;line-height:1.5}
button{margin-top:18px;padding:16px 24px;border:none;border-radius:16px;background:#284cff;color:white;font-size:18px;font-weight:800}
#arena{position:relative;width:100vw;height:100vh;display:none;overflow:hidden}
#target{position:absolute;width:80px;height:80px;border-radius:50%;background:#6aa2ff;box-shadow:0 0 40px #6aa2ff;display:none}
#info{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:700}
#message{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.4);padding:12px 18px;border-radius:12px}
</style>
</head>
<body>

<div class="screen" id="menu">
<h1>Smysl budoucnosti</h1>
<div class="sub">
Mobilní trenažér pozornosti, reakcí a vnímání okolí.
Sleduj pohyb, reaguj na zvuky a předvídej nebezpečí.
</div>

<button id="startBtn">▶️ Start tréninku</button>

<div style="margin-top:26px;opacity:.7">
MVP verze:
<br>• reakce na objekt
<br>• periferní vidění
<br>• rychlost rozhodnutí
</div>
</div>

<div id="arena">
<div id="info">
<div>⚡ Reakce: <span id="score">0</span></div>
<div>⏱️ Čas: <span id="time">30</span>s</div>
</div>

<div id="target"></div>

<div id="message">
Dotkni se objektu co nejrychleji
</div>
</div>

<script>
const menu=document.getElementById("menu");
const arena=document.getElementById("arena");
const target=document.getElementById("target");
const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const startBtn=document.getElementById("startBtn");

let score=0;
let timeLeft=30;
let running=false;
let loop;
let timer;

function vibrate(ms){
 if(navigator.vibrate){navigator.vibrate(ms);}
}

function beep(){
 try{
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value=520+Math.random()*400;
  gain.gain.value=0.05;
  osc.start();
  osc.stop(ctx.currentTime+0.12);
 }catch(e){}
}

function randomPos(){
 const w=window.innerWidth-90;
 const h=window.innerHeight-90;
 target.style.left=(Math.random()*w)+"px";
 target.style.top=(Math.random()*h)+"px";
}

function spawn(){
 if(!running)return;
 randomPos();
 target.style.display="block";

 if(Math.random()>0.5){beep();}
 vibrate(30);
}

function startGame(){
 score=0;
 timeLeft=30;
 running=true;
 scoreEl.textContent=score;
 timeEl.textContent=timeLeft;
 menu.style.display="none";
 arena.style.display="block";

 spawn();

 loop=setInterval(()=>{spawn();},1400);

 timer=setInterval(()=>{
  timeLeft--;
  timeEl.textContent=timeLeft;
  if(timeLeft<=0){endGame();}
 },1000);
}

function endGame(){
 running=false;
 clearInterval(loop);
 clearInterval(timer);
 target.style.display="none";

 arena.innerHTML=`
 <div class="screen">
 <h1>Trénink dokončen</h1>
 <div class="sub">
 Reakce: ${score}
 <br><br>
 Trénoval jsi:
 <br>• pozornost
 <br>• periferní vidění
 <br>• rychlé rozhodování
 </div>
 <button onclick="location.reload()">🔁 Znovu</button>
 </div>`;
}

function hit(e){
 e.preventDefault();
 if(!running)return;
 score++;
 scoreEl.textContent=score;
 target.style.display="none";
 vibrate(50);
 setTimeout(()=>{if(running){spawn();}},250);
}

target.addEventListener("touchstart",hit);
target.addEventListener("click",hit);

startBtn.onclick=startGame;
</script>

</body>
</html>
